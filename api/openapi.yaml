openapi: 3.0.3
info:
  title: E-Commerce Cloud Platform - Order & Catalog API
  description: Public REST API for order processing and catalog management (Contract-First)
  version: 1.0.0
  contact:
    name: Semenikhin Ruslan
    email: ruslan@example.com

servers:
  - url: http://localhost:4010/api/v1
    description: Prism Local Mock Server

paths:
  /orders:
    get:
      summary: Get paginated list of orders
      operationId: getOrders
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orders retrieved successfully
          headers:
            X-KhNTU-Trace-ID:
              $ref: '#/components/headers/X-KhNTU-Trace-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
                    example: "cursor_xyz123"
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          headers:
            X-KhNTU-Trace-ID:
              $ref: '#/components/headers/X-KhNTU-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '422':
          $ref: '#/components/responses/422Unprocessable'

  /orders/{id}:
    get:
      summary: Get order details by ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          headers:
            X-KhNTU-Trace-ID:
              $ref: '#/components/headers/X-KhNTU-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/404NotFound'

    delete:
      summary: Cancel or remove order
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Order deleted/cancelled successfully
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  headers:
    X-KhNTU-Trace-ID:
      description: Telemetry correlation header [KhNTU-Lab3-API]
      schema:
        type: string
        example: "trace-khntu-883921"

  schemas:
    CreateOrderRequest:
      type: object
      required:
        - userId
        - items
      properties:
        userId:
          type: integer
          format: int64
          example: 101
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          example: 501
        quantity:
          type: integer
          minimum: 1
          example: 2

    Order:
      type: object
      required:
        - id
        - userId
        - status
        - totalAmount
      properties:
        id:
          type: integer
          format: int64
          example: 1024
        userId:
          type: integer
          format: int64
          example: 101
        status:
          type: string
          enum: [NEW, PENDING_PAYMENT, PAID, CANCELLED]
          example: "NEW"
        totalAmount:
          type: number
          format: double
          example: 1499.99

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: "https://api.ecommerce.khntu.edu.ua/errors/bad-request"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Validation failed for order request parameters."
        instance:
          type: string
          format: uri
          example: "/api/v1/orders"

  responses:
    400BadRequest:
      description: Bad Request (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    401Unauthorized:
      description: Unauthorized Access (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    404NotFound:
      description: Resource Not Found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    422Unprocessable:
      description: Unprocessable Entity (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
            